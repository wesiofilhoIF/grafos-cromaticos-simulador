  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: {
              950: '#07090e',
              900: '#0c1017',
              850: '#111722',
              800: '#17202f',
              700: '#222f44',
              600: '#334460'
            },
            accent: {
              teal: '#14b8a6',
              cyan: '#06b6d4',
              violet: '#8b5cf6',
              amber: '#f59e0b',
              rose: '#f43f5e'
            }
          },
          animation: {
            'pulse-fast': 'pulse 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'dash': 'dash 1.5s linear infinite',

            'pop-in': 'popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',

  <!-- Estilos customizados e scrollbars finas -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-color: #07090e;
      color: #e2e8f0;
      overflow: hidden;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Custom thin scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(71, 85, 105, 0.6);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.8);
    }

    /* Pattern background for canvas */
    .canvas-grid {
      background-image: radial-gradient(rgba(148, 163, 184, 0.12) 1.2px, transparent 1.2px);
      background-size: 24px 24px;
    }

    .glass-panel {
      background: rgba(12, 16, 23, 0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Animated dash for conflicted edges */
    .edge-conflict {
      stroke: #ef4444;
      stroke-width: 3.5;
      stroke-dasharray: 6 6;
      animation: dash 1s linear infinite, glow 1.5s ease-in-out infinite alternate;
    }

    /* Odd cycle highlight */
    .edge-odd-cycle {
      stroke: #f59e0b;
      stroke-width: 4;
      stroke-dasharray: 8 4;
      animation: dash 1.2s linear infinite;
      filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.7));
    }

    /* Ghost edge preview on table hover */
    .edge-ghost-preview {
      stroke: #06b6d4;
      stroke-width: 2.5;
      stroke-dasharray: 5 5;
      animation: dash 0.8s linear infinite;
      filter: drop-shadow(0 0 6px rgba(6, 182, 212, 0.7));
    }

    /* Node pulse during simulation */
    .node-pulse-active {
      animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.3);
        opacity: 0.2;
      }
      100% {
        transform: scale(1.4);
        opacity: 0;
      }
    }

    /* SVG Smooth Motion Transitions */
    .svg-node-group {
      transition: transform 0.4s cubic-bezier(0.34, 1.45, 0.64, 1);
    }
    .svg-edge-line {
      transition: stroke 0.3s ease, stroke-width 0.3s ease, opacity 0.3s ease;
    }

    /* Matrix interactive button */
    .matrix-cell-btn {
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .matrix-cell-btn:active {
      transform: scale(0.85);
    }
  </style>
</head>

    const PALETTE = [
      { id: 0,  badge: 'C1',  name: 'Esmeralda',  hex: '#10b981', text: '#ffffff', glow: 'rgba(16, 185, 129, 0.5)' },

    // Escala pentatônica harmônica
    const PENTATONIC_FREQS = [
      261.63, 293.66, 329.63, 392.00, 440.00,
      523.25, 587.33, 659.25, 783.99, 880.00,
      1046.50, 1174.66, 1318.51, 1567.98
    ];

    // Motor de Síntese de Áudio Web Audio API
    const SoundEngine = {
      enabled: true,
      ctx: null,
      getCtx() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        return this.ctx;
      },
      playColorNote(colorId) {
        if (!this.enabled) return;
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const freq = PENTATONIC_FREQS[colorId % PENTATONIC_FREQS.length] || 440;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } catch (e) {}
      },
      playPop() {
        if (!this.enabled) return;
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(560, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.09, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.08);
        } catch (e) {}
      },
      playConflict() {
        if (!this.enabled) return;
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.22);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.22);
        } catch (e) {}
      },
      playVictory() {
        if (!this.enabled) return;
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.09);
            gain.gain.setValueAtTime(0.09, ctx.currentTime + i * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.09 + 0.5);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.09);
            osc.stop(ctx.currentTime + i * 0.09 + 0.5);
          });
        } catch (e) {}
      }
    };

    // ==========================================
    // PRESETS DE GRAFOS CLÁSSICOS
    // ==========================================
    const GRAPH_PRESETS = {
      petersen: {
        name: "Grafo de Petersen",
        desc: "10 vértices, 15 arestas. Livre de 3-ciclos, não-planar, χ = 3.",
        generate: (cx = 440, cy = 290) => {
          const nodes = [];
          const edges = [];
          const rOuter = 160;
          const rInner = 80;
          for (let i = 0; i < 5; i++) {
            const angle = (i * 72 - 90) * (Math.PI / 180);
            nodes.push({ id: `v_o${i}`, label: `O${i+1}`, x: Math.round(cx + rOuter * Math.cos(angle)), y: Math.round(cy + rOuter * Math.sin(angle)), color: null });
          }

    // ==========================================
    // MOTORES DE ANÁLISE MATEMÁTICA
    // ==========================================
    function analyzeGraphStructure(nodes, edges) {
      const n = nodes.length;
      if (n === 0) {
        return {
          n: 0, m: 0, maxDeg: 0, minDeg: 0, avgDeg: 0, density: 0,
          omega: 0, chi: 0, isBipartite: true, oddCycle: null,
          conflicts: [], usedColorsCount: 0, isValidColoring: true
        };
      }

      const idMap = new Map();
      nodes.forEach((node, i) => idMap.set(node.id, i));

      const adj = Array.from({ length: n }, () => []);
      for (const e of edges) {
        const u = idMap.get(e.source);
        const v = idMap.get(e.target);
        if (u !== undefined && v !== undefined && u !== v) {
          if (!adj[u].includes(v)) {
            adj[u].push(v);
            adj[v].push(u);
          }
        }
      }

      const degrees = adj.map(neighbors => neighbors.length);
      const maxDeg = Math.max(...degrees, 0);
      const minDeg = degrees.length ? Math.min(...degrees) : 0;
      const avgDeg = (degrees.reduce((a, b) => a + b, 0) / n).toFixed(2);
      const density = n > 1 ? ((2 * edges.length) / (n * (n - 1))).toFixed(3) : 0;

      // Clique (Bron-Kerbosch)
      let maxClique = 0;
      let bkIterations = 0;
      function bronKerbosch(R, P, X) {
        if (bkIterations++ > 25000) return;
        if (P.length === 0 && X.length === 0) {
          if (R.length > maxClique) maxClique = R.length;
          return;
        }
        const pivot = [...P, ...X][0];
        const neighborsPivot = new Set(adj[pivot] || []);
        const candidates = P.filter(v => !neighborsPivot.has(v));

        for (const v of candidates) {
          const vAdj = new Set(adj[v] || []);
          bronKerbosch(
            [...R, v],
            P.filter(u => vAdj.has(u)),
            X.filter(u => vAdj.has(u))
          );
          P = P.filter(u => u !== v);
          X.push(v);
        }
      }
      bronKerbosch([], Array.from({ length: n }, (_, i) => i), []);

      // Bipartição & Ciclo Ímpar
      const bipColor = new Array(n).fill(-1);
      const parent = new Array(n).fill(-1);
      let isBipartite = true;
      let oddCycleIds = null;

      for (let start = 0; start < n; start++) {
        if (bipColor[start] !== -1) continue;
        bipColor[start] = 0;
        const queue = [start];

        while (queue.length > 0) {
          const u = queue.shift();
          for (const v of adj[u]) {
            if (bipColor[v] === -1) {
              bipColor[v] = 1 - bipColor[u];
              parent[v] = u;
              queue.push(v);
            } else if (bipColor[v] === bipColor[u]) {
              isBipartite = false;
              if (!oddCycleIds) {
                const pathU = [u];
                let curr = u;
                while (curr !== start && parent[curr] !== -1) {
                  curr = parent[curr];
                  pathU.push(curr);
                }
                const pathV = [v];
                curr = v;
                while (curr !== start && parent[curr] !== -1) {
                  curr = parent[curr];
                  pathV.push(curr);
                }
                const setU = new Set(pathU);
                let lca = -1;
                for (const node of pathV) {
                  if (setU.has(node)) {
                    lca = node;
                    break;
                  }
                }
                const cycle = [];
                for (const node of pathU) {
                  cycle.push(node);
                  if (node === lca) break;
                }
                const vRev = [];
                for (const node of pathV) {
                  if (node === lca) break;
                  vRev.push(node);
                }
                vRev.reverse();
                cycle.push(...vRev);
                oddCycleIds = cycle.map(idx => nodes[idx].id);
              }
            }
          }
        }
      }

      // Número Cromático Exato
      let exactChi = 1;
      if (edges.length === 0) {
        exactChi = 1;
      } else if (isBipartite) {
        exactChi = 2;
      } else {
        const order = Array.from({ length: n }, (_, i) => i)
          .sort((a, b) => adj[b].length - adj[a].length);

        let found = false;
        for (let k = Math.max(3, maxClique); k <= maxDeg + 1; k++) {
          let testSteps = 0;
          const testColor = new Array(n).fill(-1);

          function backtrack(idx) {
            if (testSteps++ > 40000) return false;
            if (idx === n) return true;
            const v = order[idx];
            const forbidden = new Set();
            for (const u of adj[v]) {
              if (testColor[u] !== -1) forbidden.add(testColor[u]);
            }
            for (let c = 0; c < k; c++) {
              if (!forbidden.has(c)) {
                testColor[v] = c;
                if (backtrack(idx + 1)) return true;
                testColor[v] = -1;
              }
            }
            return false;
          }

          if (backtrack(0)) {
            exactChi = k;
            found = true;
            break;
          }
        }
        if (!found) exactChi = maxDeg + 1;
      }

      // Conflitos
      const conflicts = [];
      for (const e of edges) {
        const uNode = nodes.find(n => n.id === e.source);
        const vNode = nodes.find(n => n.id === e.target);
        if (uNode && vNode && uNode.color !== null && vNode.color !== null) {
          if (uNode.color === vNode.color) {
            conflicts.push(e.id);
          }
        }
      }

      const assignedColors = new Set(nodes.map(n => n.color).filter(c => c !== null));
      const allColored = nodes.every(n => n.color !== null);
      const isValidColoring = allColored && conflicts.length === 0;

      return {
        n, m: edges.length, maxDeg, minDeg, avgDeg, density,
        omega: maxClique, chi: exactChi, isBipartite, oddCycle: oddCycleIds,
        conflicts, usedColorsCount: assignedColors.size, isValidColoring, allColored
      };
    }

    // Heurística DSatur
    function generateDsaturSimulation(nodes, edges) {
      const n = nodes.length;
      if (n === 0) return [];

      const idMap = new Map();
      nodes.forEach((node, i) => idMap.set(node.id, i));

      const adj = Array.from({ length: n }, () => []);
      for (const e of edges) {
        const u = idMap.get(e.source);
        const v = idMap.get(e.target);
        if (u !== undefined && v !== undefined && u !== v) {
          if (!adj[u].includes(v)) {
            adj[u].push(v);
            adj[v].push(u);
          }
        }
      }

      const degrees = adj.map(neighbors => neighbors.length);
      const colors = new Array(n).fill(null);
      const steps = [];

      for (let step = 0; step < n; step++) {
        let bestV = -1;
        let maxSat = -1;
        let maxUncoloredDeg = -1;
        let maxTotalDeg = -1;

        for (let v = 0; v < n; v++) {
          if (colors[v] !== null) continue;

          const neighborColors = new Set();
          let uncoloredDeg = 0;
          for (const u of adj[v]) {
            if (colors[u] !== null) {
              neighborColors.add(colors[u]);
            } else {
              uncoloredDeg++;
            }
          }
          const sat = neighborColors.size;

          if (
            sat > maxSat ||
            (sat === maxSat && uncoloredDeg > maxUncoloredDeg) ||
            (sat === maxSat && uncoloredDeg === maxUncoloredDeg && degrees[v] > maxTotalDeg) ||
            bestV === -1
          ) {
            maxSat = sat;
            maxUncoloredDeg = uncoloredDeg;
            maxTotalDeg = degrees[v];
            bestV = v;
          }
        }

        const neighborDetails = [];
        const forbidden = new Set();
        for (const u of adj[bestV]) {
          if (colors[u] !== null) {
            forbidden.add(colors[u]);
            neighborDetails.push({ id: nodes[u].id, label: nodes[u].label, color: colors[u] });
          }
        }

        let chosenColor = 0;
        while (forbidden.has(chosenColor)) chosenColor++;
        colors[bestV] = chosenColor;

        steps.push({
          stepIndex: step + 1,
          algorithm: 'DSatur',
          targetNodeId: nodes[bestV].id,
          targetNodeLabel: nodes[bestV].label,
          chosenColor,
          saturationDegree: maxSat,
          totalDegree: degrees[bestV],
          forbiddenColors: Array.from(forbidden).sort((a,b)=>a-b),
          neighborDetails,
          reasoning: `Selecionado vértice '${nodes[bestV].label}' com maior Grau de Saturação (ρ = ${maxSat}) e ${maxUncoloredDeg} vizinhos não-coloridos. Cores vizinhas: [${Array.from(forbidden).map(c => PALETTE[c % PALETTE.length].badge).join(', ') || 'Nenhuma'}]. Menor cor viável: ${PALETTE[chosenColor % PALETTE.length].badge} (${PALETTE[chosenColor % PALETTE.length].name}).`,
          nodeColors: nodes.map((node, i) => ({ id: node.id, color: colors[i] }))
        });
      }

      return steps;
    }

    // Heurística Welsh-Powell
    function generateWelshPowellSimulation(nodes, edges) {
      const n = nodes.length;
      if (n === 0) return [];

      const idMap = new Map();
      nodes.forEach((node, i) => idMap.set(node.id, i));

      const adj = Array.from({ length: n }, () => []);
      for (const e of edges) {
        const u = idMap.get(e.source);
        const v = idMap.get(e.target);
        if (u !== undefined && v !== undefined && u !== v) {
          if (!adj[u].includes(v)) {
            adj[u].push(v);
            adj[v].push(u);
          }
        }
      }

      const degrees = adj.map(neighbors => neighbors.length);
      const sortedIndices = Array.from({ length: n }, (_, i) => i)
        .sort((a, b) => degrees[b] - degrees[a]);

      const colors = new Array(n).fill(null);
      const steps = [];
      let currentColor = 0;
      let coloredCount = 0;
      let stepNumber = 1;

      while (coloredCount < n) {
        for (const v of sortedIndices) {
          if (colors[v] !== null) continue;

          const hasConflict = adj[v].some(u => colors[u] === currentColor);
          if (!hasConflict) {
            colors[v] = currentColor;
            coloredCount++;

            steps.push({
              stepIndex: stepNumber++,
              algorithm: 'Welsh-Powell',
              targetNodeId: nodes[v].id,
              targetNodeLabel: nodes[v].label,
              chosenColor: currentColor,
              totalDegree: degrees[v],
              passIndex: currentColor + 1,
              reasoning: `Varredura para cor ${PALETTE[currentColor % PALETTE.length].badge} (${PALETTE[currentColor % PALETTE.length].name}): Vértice '${nodes[v].label}' (grau d = ${degrees[v]}) não possui conflito com os nós coloridos nesta rodada. Atribuída cor ${PALETTE[currentColor % PALETTE.length].badge}.`,
              nodeColors: nodes.map((node, i) => ({ id: node.id, color: colors[i] }))
            });
          }
        }
        currentColor++;
      }

      return steps;
    }

    // Guloso Sequencial
    function generateGreedySimulation(nodes, edges) {
      const n = nodes.length;
      if (n === 0) return [];

      const idMap = new Map();
      nodes.forEach((node, i) => idMap.set(node.id, i));

      const adj = Array.from({ length: n }, () => []);

          }
        }
      }

      const colors = new Array(n).fill(null);
      const steps = [];

      for (let i = 0; i < n; i++) {
        const forbidden = new Set();
        const neighborDetails = [];
        for (const u of adj[i]) {
          if (colors[u] !== null) {
            forbidden.add(colors[u]);

          }
        }

        let chosenColor = 0;
        while (forbidden.has(chosenColor)) chosenColor++;
        colors[i] = chosenColor;

        steps.push({

          targetNodeId: nodes[i].id,

          chosenColor,
          forbiddenColors: Array.from(forbidden).sort((a,b)=>a-b),

          reasoning: `Processando vértice sequencial '${nodes[i].label}' (índice ${i+1}/${n}). Cores bloqueadas pelos vizinhos: [${Array.from(forbidden).map(c => PALETTE[c % PALETTE.length].badge).join(', ') || 'Nenhuma'}]. Menor cor disponível: ${PALETTE[chosenColor % PALETTE.length].badge}.`,
          nodeColors: nodes.map((node, idx) => ({ id: node.id, color: colors[idx] }))
        });
      }

      return steps;
    }

    // ==========================================
    // CATÁLOGO DE ALGORITMOS DE SIMULAÇÃO
    // ==========================================
    const SIMULATION_ALGORITHMS = [
      { id: 'dsatur', name: 'DSatur (Brélaz)', tag: 'Mais Eficiente', desc: 'Prioriza vértices com maior saturação de cores' },
      { id: 'welsh-powell', name: 'Welsh-Powell', tag: 'Por Graus', desc: 'Ordena vértices por grau decrescente' },
      { id: 'greedy', name: 'Guloso Sequencial', tag: 'First-Fit', desc: 'Processa vértices na ordem natural' },

    // ==========================================
    // COLORAÇÃO EXATA (branch-and-bound) COM RASTRO
    // ==========================================
    function generateExactSimulation(nodes, edges) {
      const n = nodes.length;
      if (n === 0) return [];

      const idMap = new Map();
      nodes.forEach((node, i) => idMap.set(node.id, i));

      const adj = Array.from({ length: n }, () => []);
      for (const e of edges) {
        const u = idMap.get(e.source);
        const v = idMap.get(e.target);
        if (u === undefined || v === undefined || u === v) continue;
        if (!adj[u].includes(v)) { adj[u].push(v); adj[v].push(u); }
      }

      const degrees = adj.map(neighbors => neighbors.length);
      const maxDeg = Math.max(...degrees, 0);
      const order = Array.from({ length: n }, (_, i) => i).sort((a, b) => adj[b].length - adj[a].length);
      const steps = [];
      let stepNumber = 1;

      const vazio = () => nodes.map(node => ({ id: node.id, color: null }));

      if (edges.length === 0) {
        steps.push({
          stepIndex: stepNumber++,
          algorithm: 'Exata',
          title: 'Número cromático exato',
          targetNodeId: null,
          targetNodeLabel: 'χ(G)',
          chosenColor: null,
          nodeColors: vazio(),
          reasoning: 'O grafo não possui arestas: uma única cor basta para todos os vértices, logo χ(G) = 1.'
        });
        return steps;
      }

      // O guloso garante χ(G) ≤ Δ(G) + 1, então o laço sempre termina.
      for (let k = 2; k <= maxDeg + 1; k++) {
        const cores = new Array(n).fill(-1);
        const ordemColorida = [];
        let explorados = 0;

        const backtrack = (idx) => {
          if (explorados++ > 200000) return false;
          if (idx === n) return true;
          const v = order[idx];
          const proibidas = new Set();
          for (const u of adj[v]) if (cores[u] !== -1) proibidas.add(cores[u]);
          for (let c = 0; c < k; c++) {
            if (proibidas.has(c)) continue;
            cores[v] = c;
            ordemColorida.push(v);
            if (backtrack(idx + 1)) return true;
            ordemColorida.pop();
            cores[v] = -1;
          }
          return false;
        };

        if (!backtrack(0)) {
          steps.push({
            stepIndex: stepNumber++,
            algorithm: 'Exata',
            title: `Tentativa com ${k} cor${k > 1 ? 'es' : ''}`,
            targetNodeId: null,
            targetNodeLabel: 'χ(G)',
            chosenColor: null,
            nodeColors: vazio(),
            reasoning: `Busca retroativa com k = ${k} cor${k > 1 ? 'es' : ''} falhou (${explorados} nós explorados): não existe coloração própria com essa quantidade de cores. Logo χ(G) ≥ ${k + 1}.`
          });
          continue;
        }

        ordemColorida.forEach((v, i) => {
          const parcial = new Array(n).fill(null);
          for (let j = 0; j <= i; j++) parcial[ordemColorida[j]] = cores[ordemColorida[j]];
          const cor = cores[v];
          steps.push({
            stepIndex: stepNumber++,
            algorithm: 'Exata',
            title: `Coloração ótima — vértice ${i + 1}/${ordemColorida.length}`,
            targetNodeId: nodes[v].id,
            targetNodeLabel: nodes[v].label,
            chosenColor: cor,
            forbiddenColors: [],
            nodeColors: nodes.map((node, idx) => ({ id: node.id, color: parcial[idx] })),
            reasoning: `Com k = ${k} cor${k > 1 ? 'es' : ''} a busca encontra uma coloração válida: o vértice '${nodes[v].label}' (grau ${degrees[v]}) recebeu ${PALETTE[cor % PALETTE.length].badge} (${PALETTE[cor % PALETTE.length].name}).`
          });
        });

        steps.push({
          stepIndex: stepNumber++,
          algorithm: 'Exata',
          title: 'Número cromático exato',
          targetNodeId: null,
          targetNodeLabel: 'χ(G)',
          chosenColor: null,
          nodeColors: nodes.map((node, idx) => ({ id: node.id, color: cores[idx] })),
          reasoning: `Otimização concluída: χ(G) = ${k}. A coloração apresentada é ótima — nenhuma coloração própria deste grafo usa menos de ${k} cor${k > 1 ? 'es' : ''}.`
        });
        return steps;
      }

      return steps;
    }

    // ==========================================
    // DICA DE COLORAÇÃO (seleção DSatur)
    // ==========================================
    function computeColoringHint(nodes, edges) {
      const n = nodes.length;
      if (n === 0) return null;

      const idMap = new Map();
      nodes.forEach((node, i) => idMap.set(node.id, i));

      const adj = Array.from({ length: n }, () => []);
      for (const e of edges) {
        const u = idMap.get(e.source);
        const v = idMap.get(e.target);
        if (u === undefined || v === undefined || u === v) continue;
        if (!adj[u].includes(v)) { adj[u].push(v); adj[v].push(u); }
      }

      const cores = nodes.map(node => (node.color === undefined ? null : node.color));
      const degrees = adj.map(neighbors => neighbors.length);

      let alvo = -1;
      let maxSat = -1;
      let maxUncoloredDeg = -1;
      let maxTotalDeg = -1;

      for (let v = 0; v < n; v++) {
        if (cores[v] !== null) continue;
        const coresVizinhas = new Set();
        let naoColoridos = 0;
        for (const u of adj[v]) {
          if (cores[u] !== null) coresVizinhas.add(cores[u]);
          else naoColoridos++;
        }
        const saturacao = coresVizinhas.size;
        if (
          saturacao > maxSat ||
          (saturacao === maxSat && naoColoridos > maxUncoloredDeg) ||
          (saturacao === maxSat && naoColoridos === maxUncoloredDeg && degrees[v] > maxTotalDeg) ||
          alvo === -1
        ) {
          maxSat = saturacao;
          maxUncoloredDeg = naoColoridos;
          maxTotalDeg = degrees[v];
          alvo = v;
        }
      }

      if (alvo === -1) return null;

      const proibidas = new Set();
      for (const u of adj[alvo]) if (cores[u] !== null) proibidas.add(cores[u]);
      const proibidasOrdenadas = [...proibidas].sort((a, b) => a - b);

      let cor = 0;
      while (proibidas.has(cor)) cor++;

      return {
        nodeId: nodes[alvo].id,
        nodeLabel: nodes[alvo].label,
        color: cor,
        colorName: PALETTE[cor % PALETTE.length].name,
        colorBadge: PALETTE[cor % PALETTE.length].badge,
        forbiddenColors: proibidasOrdenadas,
        saturationDegree: maxSat,
        uncoloredDegree: maxUncoloredDeg,
        totalDegree: degrees[alvo],
        reasoning: `Pinte o vértice '${nodes[alvo].label}' com ${PALETTE[cor % PALETTE.length].badge} (${PALETTE[cor % PALETTE.length].name}). Ele é o mais saturado da cena (ρ = ${maxSat} cor(es) diferente(s) entre os vizinhos${proibidasOrdenadas.length ? `: ${proibidasOrdenadas.map(c => PALETTE[c % PALETTE.length].badge).join(', ')}` : ''}) e tem ${maxUncoloredDeg} vizinho(s) ainda sem cor.`
      };
    }

    // ==========================================
    // AVALIAÇÃO DE UMA COLORAÇÃO
    // ==========================================
    function evaluateColoring(nodes, edges, colorById) {
      const ids = new Set(nodes.map(n => n.id));
      let conflicts = 0;
      for (const e of edges) {
        if (!ids.has(e.source) || !ids.has(e.target)) continue;
        const a = colorById.get(e.source);
        const b = colorById.get(e.target);
        if (a !== undefined && b !== undefined && a === null && b === null) continue;
        if (a !== undefined && b !== undefined && a === b) conflicts++;
      }
      const used = new Set();
      for (const node of nodes) {
        const c = colorById.get(node.id);
        if (c !== undefined && c !== null) used.add(c);
      }
      const colored = nodes.filter(n => {
        const c = colorById.get(n.id);
        return c !== undefined && c !== null;
      }).length;
      return {
        coresUsadas: used.size,
        conflitos: conflicts,
        valida: conflicts === 0,
        verticesColoridos: colored,
        completo: colored === nodes.length
      };
    }

      }
      linhas.push('');

      return linhas.join('\n');
    }

    // Auto-organização física (Fruchterman-Reingold / Spring Embedder)
    function applyForceDirectedLayout(nodes, edges, width, height, iterations = 85) {
      if (nodes.length <= 1) return nodes;
      const k = Math.sqrt((width * height) / nodes.length) * 0.72;
      const positions = nodes.map(n => ({ x: n.x, y: n.y, vx: 0, vy: 0 }));
      const idMap = new Map();
      nodes.forEach((n, i) => idMap.set(n.id, i));

      for (let iter = 0; iter < iterations; iter++) {
        const temp = (1 - iter / iterations) * 25;

        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            let dx = positions[i].x - positions[j].x;
            let dy = positions[i].y - positions[j].y;
            let dist = Math.sqrt(dx * dx + dy * dy) || 1;
            if (dist > 350) continue;
            let force = (k * k) / dist;
            let fx = (dx / dist) * force;
            let fy = (dy / dist) * force;
            positions[i].vx += fx;
            positions[i].vy += fy;
            positions[j].vx -= fx;
            positions[j].vy -= fy;
          }
        }

        for (const e of edges) {
          const i = idMap.get(e.source);
          const j = idMap.get(e.target);
          if (i === undefined || j === undefined) continue;

          let dx = positions[i].x - positions[j].x;
          let dy = positions[i].y - positions[j].y;
          let dist = Math.sqrt(dx * dx + dy * dy) || 1;
          let force = (dist * dist) / k;
          let fx = (dx / dist) * force;
          let fy = (dy / dist) * force;
          positions[i].vx -= fx;
          positions[i].vy -= fy;
          positions[j].vx += fx;
          positions[j].vy += fy;
        }

        const cx = width / 2;
        const cy = height / 2;
        for (let i = 0; i < nodes.length; i++) {
          let dx = cx - positions[i].x;
          let dy = cy - positions[i].y;
          positions[i].vx += dx * 0.035;
          positions[i].vy += dy * 0.035;

          let speed = Math.sqrt(positions[i].vx * positions[i].vx + positions[i].vy * positions[i].vy) || 1;
          let step = Math.min(speed, temp);
          positions[i].x += (positions[i].vx / speed) * step;
          positions[i].y += (positions[i].vy / speed) * step;
          positions[i].vx = 0;
          positions[i].vy = 0;

          positions[i].x = Math.max(70, Math.min(width - 70, positions[i].x));
          positions[i].y = Math.max(70, Math.min(height - 70, positions[i].y));
        }
      }

      return nodes.map((node, i) => ({
        ...node,
        x: Math.round(positions[i].x),
        y: Math.round(positions[i].y)
      }));
    }

    // Relaxação Animada com Motion Suave
    function animateGraphRelaxation(currentNodes, currentEdges, setNodesCallback) {
      if (currentNodes.length <= 1) return;
      const w = 920;
      const h = 600;
      let frame = 0;
      const totalFrames = 22;

      let animPositions = currentNodes.map(n => ({ x: n.x, y: n.y, vx: 0, vy: 0 }));
      const idMap = new Map();
      currentNodes.forEach((n, i) => idMap.set(n.id, i));

      function step() {
        frame++;
        const temp = (1 - frame / totalFrames) * 18;
        const k = Math.sqrt((w * h) / Math.max(1, currentNodes.length)) * 0.70;

        for (let i = 0; i < currentNodes.length; i++) {
          for (let j = i + 1; j < currentNodes.length; j++) {
            let dx = animPositions[i].x - animPositions[j].x;
            let dy = animPositions[i].y - animPositions[j].y;
            let dist = Math.sqrt(dx * dx + dy * dy) || 1;
            if (dist > 340) continue;
            let force = (k * k) / dist;
            let fx = (dx / dist) * force * 0.05;
            let fy = (dy / dist) * force * 0.05;
            animPositions[i].vx += fx;
            animPositions[i].vy += fy;
            animPositions[j].vx -= fx;
            animPositions[j].vy -= fy;
          }
        }

        for (const e of currentEdges) {
          const i = idMap.get(e.source);
          const j = idMap.get(e.target);
          if (i === undefined || j === undefined) continue;
          let dx = animPositions[i].x - animPositions[j].x;
          let dy = animPositions[i].y - animPositions[j].y;
          let dist = Math.sqrt(dx * dx + dy * dy) || 1;
          let force = (dist * dist) / k;
          let fx = (dx / dist) * force * 0.028;
          let fy = (dy / dist) * force * 0.028;
          animPositions[i].vx -= fx;
          animPositions[i].vy -= fy;
          animPositions[j].vx += fx;
          animPositions[j].vy += fy;
        }

        const cx = w / 2;
        const cy = h / 2;
        for (let i = 0; i < currentNodes.length; i++) {
          animPositions[i].vx += (cx - animPositions[i].x) * 0.015;
          animPositions[i].vy += (cy - animPositions[i].y) * 0.015;

          let speed = Math.sqrt(animPositions[i].vx * animPositions[i].vx + animPositions[i].vy * animPositions[i].vy) || 1;
          let stepSize = Math.min(speed, temp);
          animPositions[i].x += (animPositions[i].vx / speed) * stepSize;
          animPositions[i].y += (animPositions[i].vy / speed) * stepSize;
          animPositions[i].vx *= 0.5;
          animPositions[i].vy *= 0.5;

          animPositions[i].x = Math.max(60, Math.min(w - 60, animPositions[i].x));
          animPositions[i].y = Math.max(60, Math.min(h - 60, animPositions[i].y));
        }

        setNodesCallback(prev => prev.map((n, idx) => {
          // `prev` pode ter mais vertices que o snapshot `animPositions` (um vertice
          // adicionado durante a animacao). Nesse caso o vertice novo mantem a posicao
          // que ja tinha, em vez de estourar em animPositions[idx].x.
          const p = animPositions[idx];
          return {
            ...n,
            x: Math.round(p ? p.x : n.x),
            y: Math.round(p ? p.y : n.y)
          };
        }));

        if (frame < totalFrames) {
          requestAnimationFrame(step);
        }
      }

      requestAnimationFrame(step);
    }

                forces[j].fx -= fx;
                forces[j].fy -= fy;
              }
            }

            for (const edge of edges) {
              const i = idMap.get(edge.source);
              const j = idMap.get(edge.target);
              if (i === undefined || j === undefined) continue;
              let dx = prevNodes[i].x - prevNodes[j].x;
              let dy = prevNodes[i].y - prevNodes[j].y;
              let dist = Math.sqrt(dx * dx + dy * dy) || 1;
              let force = (dist * dist) / k;
              let fx = (dx / dist) * force * 0.025;
              let fy = (dy / dist) * force * 0.025;
              forces[i].fx -= fx;
              forces[i].fy -= fy;
              forces[j].fx += fx;
              forces[j].fy += fy;
            }

            const cx = w / 2;
            const cy = h / 2;
            for (let i = 0; i < prevNodes.length; i++) {
              if (prevNodes[i].id === draggingNodeId) continue;
              forces[i].fx += (cx - prevNodes[i].x) * 0.006;
              forces[i].fy += (cy - prevNodes[i].y) * 0.006;
            }

            return prevNodes.map((node, i) => {
              if (node.id === draggingNodeId) return node;
              const speed = Math.sqrt(forces[i].fx * forces[i].fx + forces[i].fy * forces[i].fy);
              const cap = Math.min(speed, 5.5);
              const factor = speed > 0 ? cap / speed : 0;
              return {
                ...node,
                x: Math.max(50, Math.min(w - 50, node.x + forces[i].fx * factor)),
                y: Math.max(50, Math.min(h - 50, node.y + forces[i].fy * factor))
              };
            });
          });

          animId = requestAnimationFrame(stepPhysics);
        };

        animId = requestAnimationFrame(stepPhysics);
        return () => cancelAnimationFrame(animId);
      }, [livePhysics, edges, draggingNodeId]);

      // Comemoração no Modo Desafio
      useEffect(() => {
        if (challengeMode && metrics.isValidColoring && metrics.allColored) {
          if (metrics.usedColorsCount <= metrics.chi && !hasTriggeredConfetti) {
            setHasTriggeredConfetti(true);
            SoundEngine.playVictory();
            if (window.confetti) {
              window.confetti({
                particleCount: 140,
                spread: 80,
                origin: { y: 0.6 }
              });
            }
          }
        } else {
          setHasTriggeredConfetti(false);
        }
      }, [challengeMode, metrics.isValidColoring, metrics.allColored, metrics.usedColorsCount, metrics.chi, hasTriggeredConfetti]);

      // Alerta de conflito sonoro
      useEffect(() => {
        if (metrics.conflicts.length > 0) {
          SoundEngine.playConflict();
        }
      }, [metrics.conflicts.length]);

      // Reprodução Automática
      useEffect(() => {
        let interval = null;
        if (isPlaying) {
          interval = setInterval(() => {
            setCurrentStepIndex(prev => {
              if (prev < simulationSteps.length - 1) {
                const next = prev + 1;
                const step = simulationSteps[next];
                if (step && step.nodeColors) {
                  setNodes(currNodes => currNodes.map(n => {
                    const match = step.nodeColors.find(sc => sc.id === n.id);
                    return match ? { ...n, color: match.color } : n;
                  }));
                  if (step.chosenColor !== null && step.chosenColor !== undefined) {
                    SoundEngine.playColorNote(step.chosenColor);
                  }
                }
                return next;
              } else {
                setIsPlaying(false);
                return prev;
              }
            });
          }, playbackSpeed);
        }
        return () => clearInterval(interval);
      }, [isPlaying, simulationSteps, playbackSpeed]);

      // Preset Loader
      const handleLoadPreset = (key) => {
        const preset = GRAPH_PRESETS[key];
        if (!preset) return;
        const rect = canvasContainerRef.current?.getBoundingClientRect();
        const cx = rect ? rect.width / 2 : 440;
        const cy = rect ? rect.height / 2 : 290;
        const generated = preset.generate(cx, cy);
        setNodes(generated.nodes);
        setEdges(generated.edges);
        resetSimulationState();
        setHighlightOddCycle(false);
        SoundEngine.playPop();
      };

      const handleGenerateRandom = () => {
        const rect = canvasContainerRef.current?.getBoundingClientRect();
        const cx = rect ? rect.width / 2 : 440;
        const cy = rect ? rect.height / 2 : 290;
        const n = Math.max(3, Math.min(24, parseInt(randomN) || 8));
        const p = Math.max(0.05, Math.min(0.95, parseFloat(randomP) || 0.35));

        const newNodes = [];
        const newEdges = [];
        const radius = Math.min(cx, cy) * 0.7;

        for (let i = 0; i < n; i++) {
          const angle = (i * (360 / n) - 90) * (Math.PI / 180);
          newNodes.push({
            id: `rnd_${i}`,
            label: `v${i + 1}`,
            x: Math.round(cx + radius * Math.cos(angle)),
            y: Math.round(cy + radius * Math.sin(angle)),
            color: null
          });
        }

        let edgeId = 0;
        for (let i = 0; i < n; i++) {
          for (let j = i + 1; j < n; j++) {
            if (Math.random() < p) {
              newEdges.push({
                id: `e_rnd_${edgeId++}`,
                source: newNodes[i].id,
                target: newNodes[j].id
              });
            }
          }
        }

        if (newEdges.length === 0 && n > 1) {
          for (let i = 0; i < n - 1; i++) {
            newEdges.push({ id: `e_rnd_${edgeId++}`, source: newNodes[i].id, target: newNodes[i + 1].id });
          }
        }

        const arranged = applyForceDirectedLayout(newNodes, newEdges, cx * 2, cy * 2, 60);
        setNodes(arranged);
        setEdges(newEdges);
        resetSimulationState();
        setShowRandomModal(false);
        SoundEngine.playPop();
      };

      const handleClearColors = () => {
        setNodes(prev => prev.map(n => ({ ...n, color: null })));
        resetSimulationState();
      };

      const handleClearAll = () => {
        setNodes([]);
        setEdges([]);
        resetSimulationState();
      };

      const resetSimulationState = () => {
        setIsPlaying(false);
        setSimulationSteps([]);
        setCurrentStepIndex(-1);
      };

      const generateStepsFor = (algoKey) => {
        if (algoKey === 'dsatur') return generateDsaturSimulation(nodes, edges);
        if (algoKey === 'welsh-powell') return generateWelshPowellSimulation(nodes, edges);
        if (algoKey === 'greedy') return generateGreedySimulation(nodes, edges);
        if (algoKey === 'exact') return generateExactSimulation(nodes, edges);
        return generateDsaturSimulation(nodes, edges);
      };

      const handlePrepareSimulation = (algoKey = selectedAlgorithm) => {
        setIsPlaying(false);
        const steps = generateStepsFor(algoKey);

        setSimulationSteps(steps);
        if (steps.length > 0) {
          setCurrentStepIndex(0);
          const firstStep = steps[0];
          setNodes(currNodes => currNodes.map(n => {
            const match = firstStep.nodeColors.find(sc => sc.id === n.id);
            return match ? { ...n, color: match.color } : { ...n, color: null };
          }));
          if (firstStep.chosenColor !== null && firstStep.chosenColor !== undefined) {
            SoundEngine.playColorNote(firstStep.chosenColor);
          }
        }
      };

      const handleRunInstant = (algoKey = selectedAlgorithm) => {
        const steps = generateStepsFor(algoKey);

        setSimulationSteps(steps);
        if (steps.length > 0) {
          const lastStep = steps[steps.length - 1];
          setCurrentStepIndex(steps.length - 1);
          setNodes(currNodes => currNodes.map(n => {
            const match = lastStep.nodeColors.find(sc => sc.id === n.id);
            return match ? { ...n, color: match.color } : n;
          }));
          SoundEngine.playVictory();
        }
      };

      const handleStepForward = () => {
        if (simulationSteps.length === 0) {
          handlePrepareSimulation();
          return;
        }
        if (currentStepIndex < simulationSteps.length - 1) {
          const next = currentStepIndex + 1;
          setCurrentStepIndex(next);
          const step = simulationSteps[next];
          setNodes(currNodes => currNodes.map(n => {
            const match = step.nodeColors.find(sc => sc.id === n.id);
            return match ? { ...n, color: match.color } : n;
          }));
          if (step.chosenColor !== null && step.chosenColor !== undefined) {
            SoundEngine.playColorNote(step.chosenColor);
          }
        }
      };

      const handleStepBack = () => {
        if (currentStepIndex > 0) {
          const prev = currentStepIndex - 1;
          setCurrentStepIndex(prev);
          const step = simulationSteps[prev];
          setNodes(currNodes => currNodes.map(n => {
            const match = step.nodeColors.find(sc => sc.id === n.id);
            return match ? { ...n, color: match.color } : n;
          }));
          SoundEngine.playPop();
        }
      };

      const handleAutoLayout = () => {
        const rect = canvasContainerRef.current?.getBoundingClientRect();
        const w = rect ? rect.width : 920;
        const h = rect ? rect.height : 600;
        const arranged = applyForceDirectedLayout(nodes, edges, w, h, 90);
        setNodes(arranged);
        SoundEngine.playPop();
      };

      // ==========================================
      // OPERAÇÕES DO MODO DE PREENCHIMENTO DE TABELA COM MOTION
      // ==========================================

      // Alternar conexão de célula da matriz de adjacência (0 <-> 1)
      const handleToggleMatrixCell = (uId, vId) => {
        if (uId === vId) return; // Laços próprios desabilitados em grafos simples

        const exists = edges.some(e =>
          (e.source === uId && e.target === vId) ||
          (e.source === vId && e.target === uId)
        );

        let updatedEdges;
        if (exists) {
          updatedEdges = edges.filter(e =>
            !((e.source === uId && e.target === vId) || (e.source === vId && e.target === uId))
          );
          SoundEngine.playPop();
        } else {
          const newEdge = {
            id: `e_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`,
            source: uId,
            target: vId
          };
          updatedEdges = [...edges, newEdge];
          SoundEngine.playColorNote(edges.length % PALETTE.length);
        }

        setEdges(updatedEdges);
        resetSimulationState();

        // Se motion automático estiver ativo, relaxa suavemente a posição dos nós
        if (autoMotionOnEdit) {
          animateGraphRelaxation(nodes, updatedEdges, setNodes);
        }
      };

      // Adicionar novo vértice via tabela
      const handleAddVertexFromTable = () => {
        const rect = canvasContainerRef.current?.getBoundingClientRect();
        const cx = rect ? rect.width / 2 : 440;
        const cy = rect ? rect.height / 2 : 290;

        const nextNum = nodes.length + 1;
        const angle = (nextNum * 47) % 360 * (Math.PI / 180);
        const r = 120 + ((nextNum * 23) % 80);

        const newId = `v_${Date.now().toString(36)}`;
        const newNode = {
          id: newId,
          label: `v${nextNum}`,
          x: Math.round(cx + r * Math.cos(angle)),
          y: Math.round(cy + r * Math.sin(angle)),
          color: null
        };

        const updatedNodes = [...nodes, newNode];
        setNodes(updatedNodes);
        resetSimulationState();
        SoundEngine.playPop();

        if (autoMotionOnEdit) {
          animateGraphRelaxation(updatedNodes, edges, setNodes);
        }
      };

      // Remover vértice via tabela
      const handleDeleteVertexFromTable = (nodeId) => {
        const updatedNodes = nodes.filter(n => n.id !== nodeId);
        const updatedEdges = edges.filter(e => e.source !== nodeId && e.target !== nodeId);
        setNodes(updatedNodes);
        setEdges(updatedEdges);
        if (inspectingNodeId === nodeId) setInspectingNodeId(null);
        resetSimulationState();
        SoundEngine.playPop();

        if (autoMotionOnEdit) {
          animateGraphRelaxation(updatedNodes, updatedEdges, setNodes);
        }
      };

      // Grafo Complementar (Inverte todos os 0s e 1s na matriz)
      const handleComplementaryGraph = () => {
        if (nodes.length <= 1) return;
        const newEdges = [];
        let edgeId = 0;

        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const uId = nodes[i].id;
            const vId = nodes[j].id;
            const hasEdge = edges.some(e =>
              (e.source === uId && e.target === vId) ||
              (e.source === vId && e.target === uId)
            );
            if (!hasEdge) {
              newEdges.push({
                id: `e_comp_${edgeId++}`,
                source: uId,
                target: vId
              });
            }
          }
        }

        setEdges(newEdges);
        resetSimulationState();
        SoundEngine.playVictory();

        if (autoMotionOnEdit) {
          animateGraphRelaxation(nodes, newEdges, setNodes);
        }
      };

      // Grafo Completo Kn via matriz
      const handleCompleteGraph = () => {
        if (nodes.length <= 1) return;
        const newEdges = [];
        let edgeId = 0;
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            newEdges.push({
              id: `e_k_${edgeId++}`,
              source: nodes[i].id,
              target: nodes[j].id
            });
          }
        }
        setEdges(newEdges);
        resetSimulationState();
        SoundEngine.playVictory();

        if (autoMotionOnEdit) {
          animateGraphRelaxation(nodes, newEdges, setNodes);
        }
      };

      // Zerar todas as arestas da matriz (Grafo Nulo)
      const handleClearMatrix = () => {
        setEdges([]);
        resetSimulationState();
        SoundEngine.playPop();
      };

      // Adicionar aresta manualmente pela tabela de arestas
      const handleAddEdgeFromTable = () => {
        if (!newEdgeSource || !newEdgeTarget || newEdgeSource === newEdgeTarget) return;
        const exists = edges.some(e =>
          (e.source === newEdgeSource && e.target === newEdgeTarget) ||
          (e.source === newEdgeTarget && e.target === newEdgeSource)
        );
        if (!exists) {
          const newEdge = {
            id: `e_tbl_${Date.now().toString(36)}`,
            source: newEdgeSource,
            target: newEdgeTarget
          };
          const updatedEdges = [...edges, newEdge];
          setEdges(updatedEdges);
          resetSimulationState();
          SoundEngine.playPop();
          if (autoMotionOnEdit) {
            animateGraphRelaxation(nodes, updatedEdges, setNodes);
          }
        }
      };

      // Canvas Coordenadas
      const getSvgCoordinates = useCallback((clientX, clientY) => {
        if (!svgRef.current) return { x: 0, y: 0 };
        const rect = svgRef.current.getBoundingClientRect();
        const rawX = clientX - rect.left;
        const rawY = clientY - rect.top;
        return {
          x: (rawX - pan.x) / zoom,
          y: (rawY - pan.y) / zoom
        };
      }, [pan, zoom]);

      const handleCanvasMouseDown = (e) => {
        setContextMenu(null);
        if (e.button === 1 || e.altKey) {
          setIsPanning(true);
          setPanStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
          return;
        }

        const coords = getSvgCoordinates(e.clientX, e.clientY);

        if (currentTool === 'addNode') {
          const newId = `v_${Date.now().toString(36)}`;
          const nextNumber = nodes.length + 1;
          const newNode = {
            id: newId,
            label: `v${nextNumber}`,
            x: Math.round(coords.x),
            y: Math.round(coords.y),
            color: null
          };
          const updatedNodes = [...nodes, newNode];
          setNodes(updatedNodes);
          resetSimulationState();
          SoundEngine.playPop();
          if (autoMotionOnEdit) {
            animateGraphRelaxation(updatedNodes, edges, setNodes);
          }
        } else if (currentTool === 'select') {
          setIsPanning(true);
          setPanStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
        }
      };

      const handleCanvasMouseMove = (e) => {
        const coords = getSvgCoordinates(e.clientX, e.clientY);
        setCursorPos(coords);

        if (isPanning) {
          setPan({
            x: e.clientX - panStart.x,
            y: e.clientY - panStart.y
          });
          return;
        }

        if (draggingNodeId) {
          setNodes(prev => prev.map(n => {
            if (n.id === draggingNodeId) {
              return { ...n, x: Math.round(coords.x), y: Math.round(coords.y) };
            }
            return n;
          }));
        }
      };

      const handleCanvasMouseUp = () => {
        setIsPanning(false);
        setDraggingNodeId(null);
      };

      const handleWheel = (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
        const newZoom = Math.min(3.0, Math.max(0.3, zoom * zoomFactor));

        if (!svgRef.current) return;
        const rect = svgRef.current.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const newPanX = mouseX - (mouseX - pan.x) * (newZoom / zoom);
        const newPanY = mouseY - (mouseY - pan.y) * (newZoom / zoom);

        setZoom(newZoom);
        setPan({ x: newPanX, y: newPanY });
      };

      const handleResetZoom = () => {
        setZoom(1);
        setPan({ x: 0, y: 0 });
      };

      const handleFitView = () => {
        if (nodes.length === 0) {
          handleResetZoom();
          return;
        }
        const minX = Math.min(...nodes.map(n => n.x));
        const maxX = Math.max(...nodes.map(n => n.x));
        const minY = Math.min(...nodes.map(n => n.y));
        const maxY = Math.max(...nodes.map(n => n.y));

        const rect = canvasContainerRef.current?.getBoundingClientRect();
        const w = rect ? rect.width : 920;
        const h = rect ? rect.height : 600;

        const graphW = maxX - minX + 120;
        const graphH = maxY - minY + 120;
        const fitScale = Math.min(2.0, Math.max(0.4, Math.min(w / graphW, h / graphH) * 0.88));

        const centerX = (minX + maxX) / 2;
        const centerY = (minY + maxY) / 2;

        setZoom(fitScale);
        setPan({
          x: w / 2 - centerX * fitScale,
          y: h / 2 - centerY * fitScale
        });
      };

      const handleNodeClick = (e, node) => {
        e.stopPropagation();
        setContextMenu(null);

        if (currentTool === 'remove') {
          handleDeleteVertexFromTable(node.id);
        } else if (currentTool === 'paint') {
          setNodes(prev => prev.map(n => n.id === node.id ? { ...n, color: selectedColorId } : n));
          if (selectedColorId !== null) SoundEngine.playColorNote(selectedColorId);
          else SoundEngine.playPop();
        } else if (currentTool === 'addEdge') {
          if (!edgeStartNodeId) {
            setEdgeStartNodeId(node.id);
            SoundEngine.playPop();
          } else if (edgeStartNodeId === node.id) {
            setEdgeStartNodeId(null);
          } else {
            handleToggleMatrixCell(edgeStartNodeId, node.id);
            setEdgeStartNodeId(null);
          }
        } else if (currentTool === 'select') {
          setInspectingNodeId(node.id === inspectingNodeId ? null : node.id);
        }
      };

      const handleNodeDoubleClick = (e, node) => {
        e.stopPropagation();
        const nextColor = node.color === null ? 0 : (node.color + 1 < PALETTE.length ? node.color + 1 : null);
        setNodes(prev => prev.map(n => n.id === node.id ? { ...n, color: nextColor } : n));
        if (nextColor !== null) SoundEngine.playColorNote(nextColor);
        else SoundEngine.playPop();
      };

      const handleNodeContextMenu = (e, node) => {
        e.preventDefault();
        e.stopPropagation();
        setContextMenu({
          nodeId: node.id,
          x: e.clientX,
          y: e.clientY
        });
      };

      const handleEdgeClick = (e, edge) => {
        e.stopPropagation();
        setContextMenu(null);
        if (currentTool === 'remove') {
          setEdges(prev => prev.filter(ed => ed.id !== edge.id));
          resetSimulationState();
          SoundEngine.playPop();
        }
      };

      const handleExportJSON = () => {
        const data = {
          name: "Grafo Cromático",
          timestamp: new Date().toISOString(),
          nodes: nodes.map(({ id, label, x, y, color }) => ({ id, label, x, y, color })),
          edges: edges.map(({ id, source, target }) => ({ id, source, target }))
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `grafo_cromatico_${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImportJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (Array.isArray(data.nodes) && Array.isArray(data.edges)) {
              setNodes(data.nodes);
              setEdges(data.edges);
              resetSimulationState();
              SoundEngine.playPop();
            } else {
              alert("Formato de arquivo JSON inválido!");
            }
          } catch (err) {
            alert("Erro ao ler JSON: " + err.message);
          }
        };
        reader.readAsText(file);
      };

      const handleExportSVG = () => {
        if (!svgRef.current) return;
        const svgData = new XMLSerializer().serializeToString(svgRef.current);
        const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `grafo_cromatico_${Date.now()}.svg`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const inspectedNode = useMemo(() => {
        if (!inspectingNodeId) return null;
        const node = nodes.find(n => n.id === inspectingNodeId);
        if (!node) return null;

        const neighborEdges = edges.filter(e => e.source === node.id || e.target === node.id);
        const neighborNodeIds = neighborEdges.map(e => e.source === node.id ? e.target : e.source);
        const neighbors = nodes.filter(n => neighborNodeIds.includes(n.id));

        const forbiddenColors = new Set(neighbors.map(n => n.color).filter(c => c !== null));
        return {
          ...node,
          degree: neighbors.length,
          neighbors,
          forbiddenColors: Array.from(forbiddenColors),
        };
      }, [inspectingNodeId, nodes, edges]);

      const currentStep = useMemo(() => {
        if (currentStepIndex >= 0 && currentStepIndex < simulationSteps.length) {
          return simulationSteps[currentStepIndex];
        }
        return null;
      }, [currentStepIndex, simulationSteps]);

      const colorClasses = useMemo(() => {
        const classes = new Map();
        nodes.forEach(n => {
          if (n.color !== null) {
            if (!classes.has(n.color)) classes.set(n.color, []);
            classes.get(n.color).push(n);
          }
        });
        return Array.from(classes.entries()).sort((a, b) => a[0] - b[0]);
      }, [nodes]);

      // Altura do painel de tabelas
      const panelHeightClasses = {
        compact: 'h-40',
        medium: 'h-72',
        large: 'h-96'
      };

      return (
        <div className="flex flex-col h-screen w-screen overflow-hidden bg-dark-950 select-none" onClick={() => setContextMenu(null)}>
          
          {/* HEADER PRINCIPAL */}
          <header className="h-16 border-b border-slate-800/80 bg-dark-900/90 px-4 flex items-center justify-between shrink-0 z-30 backdrop-blur-md">
            
            {/* Logo e Título */}
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-500 via-cyan-500 to-indigo-500 flex items-center justify-center shadow-lg shadow-teal-500/20 text-white font-bold text-lg">
                χ
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="font-extrabold text-base tracking-tight text-white flex items-center gap-1.5">
                    Simulador de Grafos Cromáticos
                  </h1>
                  <span className="text-[10px] font-semibold uppercase px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 font-mono">
                    Tabelas & Motion
                  </span>
