                      <span className="block font-semibold text-[11px] truncate">{item.name}</span>
                    </button>
                  ))}
                </div>

                <div className="flex items-center gap-2 mt-3 pt-2 border-t border-slate-800">
                  <button
                    onClick={handleClearColors}
                    className="flex-1 py-1.5 rounded-lg bg-dark-900 hover:bg-dark-850 border border-slate-800 text-slate-400 hover:text-white text-[11px] font-semibold transition"
                  >
                    Limpar Cores
                  </button>
                  <button
                    onClick={handleClearAll}
                    className="flex-1 py-1.5 rounded-lg bg-rose-950/30 hover:bg-rose-900/40 border border-rose-800/40 text-rose-300 text-[11px] font-semibold transition"
                  >
                    Limpar Tudo
                  </button>
                </div>
              </div>

            </aside>

            {/* CANVAS INTERATIVO */}
            <main className="flex-1 flex flex-col relative overflow-hidden bg-dark-950">
              
              {/* Toolbar Flutuante de Instruções */}
              <div className="absolute top-4 left-4 z-10 glass-panel px-3.5 py-2 rounded-xl text-xs flex items-center gap-2.5 shadow-lg pointer-events-none">
                <span className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                <span className="text-slate-300">
                  {hoveredMatrixCell ? (
                    <span>
                      Destaque da Célula da Tabela: <strong className="text-cyan-300">{nodes.find(n => n.id === hoveredMatrixCell.uId)?.label}</strong> ↔ <strong className="text-cyan-300">{nodes.find(n => n.id === hoveredMatrixCell.vId)?.label}</strong>
                    </span>
                  ) : currentTool === 'select' ? (
                    "Modo Selecionar: Arraste nós, duplo-clique para mudar cor, botão direito para paleta rápida."
                  ) : currentTool === 'addNode' ? (
                    "Modo Vértice: Clique no canvas ou use a tabela abaixo para criar novos vértices."
                  ) : currentTool === 'addEdge' ? (
                    edgeStartNodeId ? "Clique no segundo vértice para conectar a aresta." : "Clique no primeiro vértice de origem."
                  ) : currentTool === 'paint' ? (
                    selectedColorId !== null ? `Modo Pintar: Clique no vértice para aplicar a cor ${PALETTE[selectedColorId % PALETTE.length].badge}.` : "Modo Borracha: Clique no vértice para remover sua cor."
                  ) : (
                    "Modo Excluir: Clique em qualquer nó ou aresta para remover."
                  )}
                </span>
              </div>

              {/* Controles de Zoom Flutuantes */}
              <div className="absolute bottom-6 right-6 z-10 flex flex-col gap-1.5 glass-panel p-1.5 rounded-xl shadow-xl">
                <button
                  onClick={() => setZoom(z => Math.min(3, z * 1.2))}
                  className="w-8 h-8 rounded-lg bg-dark-900 hover:bg-dark-800 text-slate-300 flex items-center justify-center transition"
                  title="Aumentar Zoom"
                >
                  <Icons.ZoomIn />
                </button>
                <button
                  onClick={() => setZoom(z => Math.max(0.3, z / 1.2))}
                  className="w-8 h-8 rounded-lg bg-dark-900 hover:bg-dark-800 text-slate-300 flex items-center justify-center transition"
                  title="Diminuir Zoom"
                >
                  <Icons.ZoomOut />
                </button>
                <button
                  onClick={handleFitView}
                  className="w-8 h-8 rounded-lg bg-dark-900 hover:bg-dark-800 text-slate-300 flex items-center justify-center transition"
                  title="Centralizar Grafo"
                >
                  <Icons.Maximize />
                </button>
                <button
                  onClick={handleResetZoom}
                  className="w-8 h-8 rounded-lg bg-dark-900 hover:bg-dark-800 text-slate-300 text-[10px] font-mono flex items-center justify-center transition"
                  title="Resetar Zoom para 100%"
                >
                  1x
                </button>
              </div>

              {/* Viewport SVG Interativo */}
              <div
                ref={canvasContainerRef}
                className="w-full flex-1 canvas-grid relative cursor-crosshair overflow-hidden"
                onMouseDown={handleCanvasMouseDown}
                onMouseMove={handleCanvasMouseMove}
                onMouseUp={handleCanvasMouseUp}
                onWheel={handleWheel}
              >
                <svg
                  ref={svgRef}
                  className="w-full h-full overflow-visible"
                >
                  <defs>
                    <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
                      <feDropShadow dx="0" dy="0" stdDeviation="6" floodColor="#ef4444" floodOpacity="0.8"/>
                    </filter>
                    <filter id="glow-active" x="-50%" y="-50%" width="200%" height="200%">
                      <feDropShadow dx="0" dy="0" stdDeviation="8" floodColor="#14b8a6" floodOpacity="0.9"/>
                    </filter>
                    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
                      <feDropShadow dx="0" dy="0" stdDeviation="6" floodColor="#f59e0b" floodOpacity="0.8"/>
                    </filter>
                    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
                      <feDropShadow dx="0" dy="0" stdDeviation="6" floodColor="#06b6d4" floodOpacity="0.85"/>
                    </filter>
                  </defs>

                  <g transform={`translate(${pan.x}, ${pan.y}) scale(${zoom})`}>
                    
                    {/* ARESTAS */}
                    {edges.map(edge => {
                      const sourceNode = nodes.find(n => n.id === edge.source);
                      const targetNode = nodes.find(n => n.id === edge.target);
                      if (!sourceNode || !targetNode) return null;

                      const isConflict = metrics.conflicts.includes(edge.id);
                      const isOddCycleEdge = highlightOddCycle && metrics.oddCycle && (
                        metrics.oddCycle.includes(sourceNode.id) &&
                        metrics.oddCycle.includes(targetNode.id)
                      );
                      const isCurrentStepEdge = currentStep && (
                        (edge.source === currentStep.targetNodeId && targetNode.color !== null) ||
                        (edge.target === currentStep.targetNodeId && sourceNode.color !== null)
                      );
                      const isTableHoveredEdge = hoveredMatrixCell && (
                        (edge.source === hoveredMatrixCell.uId && edge.target === hoveredMatrixCell.vId) ||
                        (edge.source === hoveredMatrixCell.vId && edge.target === hoveredMatrixCell.uId)
                      );

                      const midX = (sourceNode.x + targetNode.x) / 2;
                      const midY = (sourceNode.y + targetNode.y) / 2;

                      return (
                        <g key={edge.id} className="cursor-pointer" onClick={(e) => handleEdgeClick(e, edge)}>
                          <line
                            x1={sourceNode.x}
                            y1={sourceNode.y}
                            x2={targetNode.x}
                            y2={targetNode.y}
                            className={`svg-edge-line ${
                              isConflict
                                ? 'edge-conflict'
                                : isOddCycleEdge
                                ? 'edge-odd-cycle'
                                : isTableHoveredEdge
                                ? 'stroke-cyan-300 stroke-[4] drop-shadow-[0_0_8px_rgba(6,182,212,0.9)]'
                                : isCurrentStepEdge
                                ? 'stroke-cyan-400 stroke-[3]'
                                : 'stroke-slate-700/80 stroke-2 hover:stroke-slate-400'
                            }`}
                          />

                          <line
                            x1={sourceNode.x}
                            y1={sourceNode.y}
                            x2={targetNode.x}
                            y2={targetNode.y}
                            stroke="transparent"
                            strokeWidth="16"
                          />

                          {isConflict && (
                            <g transform={`translate(${midX}, ${midY})`} className="pointer-events-none">
                              <circle r="9" fill="#ef4444" className="animate-pulse" />
                              <text textAnchor="middle" dy="3.5" fill="#ffffff" fontSize="10" fontWeight="bold">!</text>
                            </g>
                          )}
                        </g>
                      );
                    })}

                    {/* Linha Fantasma Preview ao passar o mouse sobre célula desconectada da matriz */}
                    {hoveredMatrixCell && (() => {
                      const uNode = nodes.find(n => n.id === hoveredMatrixCell.uId);
                      const vNode = nodes.find(n => n.id === hoveredMatrixCell.vId);
                      if (!uNode || !vNode || uNode.id === vNode.id) return null;
                      const hasEdge = edges.some(e =>
                        (e.source === uNode.id && e.target === vNode.id) ||
                        (e.source === vNode.id && e.target === uNode.id)
                      );
                      if (hasEdge) return null;
                      return (
                        <line
                          x1={uNode.x}
                          y1={uNode.y}
                          x2={vNode.x}
                          y2={vNode.y}
                          className="edge-ghost-preview pointer-events-none"
                        />
                      );
                    })()}

                    {/* Linha Preview de Conexão no modo Criar Aresta */}
                    {edgeStartNodeId && currentTool === 'addEdge' && (() => {
                      const startNode = nodes.find(n => n.id === edgeStartNodeId);
                      if (!startNode) return null;
                      return (
                        <line
                          x1={startNode.x}
                          y1={startNode.y}
                          x2={cursorPos.x}
                          y2={cursorPos.y}
                          stroke="#14b8a6"
                          strokeWidth="2.5"
                          strokeDasharray="5 5"
                          className="pointer-events-none animate-dash"
                        />
                      );
                    })()}

                    {/* VÉRTICES COM MOTION SUAVE */}
                    {nodes.map(node => {
                      const isCurrentStepTarget = currentStep && currentStep.targetNodeId === node.id;
                      const isHintTarget = hint && hint.nodeId === node.id;
                      const isInspected = inspectedNode && inspectedNode.id === node.id;
                      const isEdgeSource = edgeStartNodeId === node.id;
                      const isOddCycleNode = highlightOddCycle && metrics.oddCycle && metrics.oddCycle.includes(node.id);
                      const isTableHoveredNode = hoveredMatrixCell && (node.id === hoveredMatrixCell.uId || node.id === hoveredMatrixCell.vId);

                      const paletteItem = node.color !== null ? PALETTE[node.color % PALETTE.length] : null;
                      const fillColor = paletteItem ? paletteItem.hex : '#17202f';
                      const textColor = paletteItem ? paletteItem.text : '#cbd5e1';

                      return (
                        <g
                          key={node.id}
                          transform={`translate(${node.x}, ${node.y})`}
                          className="cursor-pointer svg-node-group"
                          onMouseDown={(e) => {
                            e.stopPropagation();
                            if (e.button === 0 && currentTool === 'select') {
                              setDraggingNodeId(node.id);
                            }
                          }}
                          onClick={(e) => handleNodeClick(e, node)}
                          onDoubleClick={(e) => handleNodeDoubleClick(e, node)}
                          onContextMenu={(e) => handleNodeContextMenu(e, node)}
                          onMouseEnter={() => setHoveredNodeId(node.id)}
                          onMouseLeave={() => setHoveredNodeId(null)}
                        >
                          {/* Anel Pulsante no Passo Atual */}
                          {isCurrentStepTarget && (
                            <circle
                              r="30"
                              fill="none"
                              stroke="#14b8a6"
                              strokeWidth="3"
                              className="node-pulse-active"
                            />
                          )}

                          {/* Destaque ao passar o mouse na tabela de matriz */}
                          {isTableHoveredNode && (
                            <circle
                              r="28"
                              fill="none"
                              stroke="#06b6d4"
                              strokeWidth="3"
                              strokeDasharray="4 2"
                              filter="url(#glow-cyan)"
                              className="animate-spin"
                              style={{ animationDuration: '6s' }}
                            />
                          )}

                          {/* Destaque para Ciclo Ímpar */}
                          {isOddCycleNode && (
                            <circle
                              r="26"
                              fill="none"
                              stroke="#f59e0b"
                              strokeWidth="2.5"
                              strokeDasharray="4 2"
                              filter="url(#glow-gold)"
                            />
                          )}

                          {/* Destaque da Dica */}
                          {isHintTarget && (
                            <circle
                              r="32"
                              fill="none"
                              stroke="#fbbf24"
                              strokeWidth="3"
                              strokeDasharray="6 4"
                              className="node-pulse-active"
                            />
                          )}

                          {/* Corpo Principal do Nó */}
                          <circle
                            r={isTableHoveredNode ? "22" : "20"}
                            fill={fillColor}
                            stroke={
                              isCurrentStepTarget
                                ? '#14b8a6'
                                : isHintTarget
                                ? '#fbbf24'
                                : isTableHoveredNode
                                ? '#06b6d4'
                                : isInspected || isEdgeSource
                                ? '#38bdf8'
                                : isOddCycleNode
                                ? '#f59e0b'
                                : node.color !== null
                                ? 'rgba(255,255,255,0.3)'
                                : '#334460'
                            }
                            strokeWidth={isCurrentStepTarget || isHintTarget || isInspected || isEdgeSource || isTableHoveredNode ? "3.5" : "2"}
                            className="transition-all duration-200"
                            filter={isCurrentStepTarget ? 'url(#glow-active)' : isHintTarget ? 'url(#glow-gold)' : isTableHoveredNode ? 'url(#glow-cyan)' : undefined}
                          />

                          {/* Rótulo */}
                          <text
                            textAnchor="middle"
                            dy="4.5"
                            fill={textColor}
                            fontSize="11"
                            fontWeight="700"
                            className="font-mono pointer-events-none select-none"
                          >
                            {node.label}
                          </text>

                          {/* Badge de Cor */}
                          {paletteItem && (
                            <g transform="translate(13, -13)" className="pointer-events-none">
                              <circle r="7.5" fill="#0c1017" stroke={paletteItem.hex} strokeWidth="1.5" />
                              <text
                                textAnchor="middle"
                                dy="2.5"
                                fill="#ffffff"
                                fontSize="7"
                                fontWeight="800"
                                className="font-mono"
                              >
                                {paletteItem.badge}
                              </text>
                            </g>
                          )}
                        </g>
                      );
                    })}

                  </g>
                </svg>
              </div>

              {/* MENU RÁPIDO DE CORES FLUTUANTE */}
              {contextMenu && (
                <div
                  className="fixed z-50 glass-panel p-2.5 rounded-2xl shadow-2xl border border-teal-500/40 animate-fade-in"
                  style={{ left: Math.min(window.innerWidth - 240, contextMenu.x), top: Math.min(window.innerHeight - 180, contextMenu.y) }}
                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="flex items-center justify-between pb-1.5 mb-1.5 border-b border-slate-800 text-[11px] font-mono font-bold text-slate-300">
                    <span>Paleta Rápida</span>
                    <button
                      onClick={() => {
                        setNodes(prev => prev.map(n => n.id === contextMenu.nodeId ? { ...n, color: null } : n));
                        setContextMenu(null);
                        SoundEngine.playPop();
                      }}
                      className="text-[10px] px-2 py-0.5 rounded bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 flex items-center gap-1"
                    >
                      <Icons.Eraser /> Limpar
                    </button>
                  </div>
                  <div className="grid grid-cols-7 gap-1.5 w-52">
                    {PALETTE.map(c => (
                      <button
                        key={c.id}
                        onClick={() => {
                          setNodes(prev => prev.map(n => n.id === contextMenu.nodeId ? { ...n, color: c.id } : n));
                          SoundEngine.playColorNote(c.id);
                          setContextMenu(null);
                        }}
                        style={{ backgroundColor: c.hex }}
                        className="h-6 w-6 rounded-md text-[9px] font-extrabold flex items-center justify-center transition transform hover:scale-110 active:scale-95 shadow"
                        title={`${c.name} (${c.badge})`}
                      >
                        <span style={{ color: c.text }}>{c.badge}</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* CARD DE INSPEÇÃO DE VÉRTICE */}
              {inspectedNode && (
                <div className="absolute top-16 right-4 z-20 w-72 glass-panel p-3.5 rounded-2xl border border-cyan-500/30 shadow-2xl">
                  <div className="flex items-center justify-between pb-2 mb-2 border-b border-slate-800">
                    <div className="flex items-center gap-2">
                      <div
                        className="w-4 h-4 rounded-full border border-white/20"
                        style={{ backgroundColor: inspectedNode.color !== null ? PALETTE[inspectedNode.color % PALETTE.length].hex : '#475569' }}
                      />
                      <h4 className="font-extrabold text-sm text-white font-mono">
                        Vértice {inspectedNode.label}
                      </h4>
                    </div>
                    <button
                      onClick={() => setInspectingNodeId(null)}
                      className="text-slate-400 hover:text-white text-xs px-1.5 py-0.5 rounded bg-dark-850"
                    >
                      ✕
                    </button>
                  </div>

                  <div className="space-y-2 text-xs">
                    <div className="flex justify-between text-slate-300">
                      <span className="text-slate-500">Grau d(v):</span>
                      <span className="font-bold font-mono text-cyan-400">{inspectedNode.degree} arestas</span>
                    </div>

                    <div className="flex justify-between text-slate-300">
                      <span className="text-slate-500">Cor Atual:</span>
                      <span className="font-bold font-mono">
                        {inspectedNode.color !== null
                          ? `${PALETTE[inspectedNode.color % PALETTE.length].badge} - ${PALETTE[inspectedNode.color % PALETTE.length].name}`
                          : 'Não colorido'}
                      </span>
                    </div>

                    <div>
                      <span className="text-slate-500 block mb-1">Vizinhos ({inspectedNode.neighbors.length}):</span>
                      <div className="flex flex-wrap gap-1">
                        {inspectedNode.neighbors.map(nb => (
                          <span
                            key={nb.id}
                            className="px-1.5 py-0.5 rounded text-[10px] font-mono font-bold flex items-center gap-1 border border-slate-700 bg-dark-900"
                          >
                            <span
                              className="w-2 h-2 rounded-full"
                              style={{ backgroundColor: nb.color !== null ? PALETTE[nb.color % PALETTE.length].hex : '#64748b' }}
                            />
                            {nb.label}
                          </span>
                        ))}
                      </div>
                    </div>

                    <div className="pt-2 border-t border-slate-800">
                      <span className="text-slate-500 block mb-1">Cores Proibidas nesta Vizinhança:</span>
                      {inspectedNode.forbiddenColors.length > 0 ? (
                        <div className="flex gap-1">
                          {inspectedNode.forbiddenColors.map(c => (
                            <span
                              key={c}
                              className="px-1.5 py-0.5 rounded text-[9px] font-bold font-mono"
                              style={{
                                backgroundColor: PALETTE[c % PALETTE.length].hex,
                                color: PALETTE[c % PALETTE.length].text
                              }}
                            >
                              {PALETTE[c % PALETTE.length].badge}
                            </span>
                          ))}
                        </div>
                      ) : (
                        <span className="text-slate-500 text-[10px]">Nenhuma cor ocupada pelos vizinhos.</span>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* ========================================================= */}
              {/* PAINEL INFERIOR INTERATIVO: MODO DE PREENCHER TABELAS COM MOTION */}
              {/* ========================================================= */}
              <div className="border-t border-slate-800/80 bg-dark-900/95 shrink-0 z-20 flex flex-col transition-all duration-300">
                
                {/* Abas Superiores do Painel de Tabelas */}
                <div className="flex items-center justify-between px-4 border-b border-slate-800/80 text-xs shrink-0">
                  <div className="flex items-center gap-1">
                    {[
                      { id: 'matrix', label: `Matriz de Adjacência (${nodes.length}×${nodes.length})`, icon: Icons.Grid },
                      { id: 'edges', label: `Tabela de Arestas (${edges.length})`, icon: Icons.Link },
                      { id: 'vertices', label: `Tabela de Vértices (${nodes.length})`, icon: Icons.Table },
                      { id: 'classes', label: `Classes de Cores (${colorClasses.length})`, icon: Icons.Palette },
                      { id: 'properties', label: 'Propriedades Matemáticas', icon: Icons.BookOpen },
                      { id: 'io', label: 'Exportar / Importar', icon: Icons.Download }
                    ].map(tab => {
                      const TabIcon = tab.icon;
                      return (
                        <button
                          key={tab.id}
                          onClick={() => setActiveBottomTab(tab.id)}
                          className={`px-3 py-2 font-semibold transition border-b-2 flex items-center gap-1.5 ${
                            activeBottomTab === tab.id
                              ? 'border-cyan-400 text-cyan-300 bg-dark-850'
                              : 'border-transparent text-slate-400 hover:text-slate-200'
                          }`}
                        >
                          <TabIcon />
                          <span>{tab.label}</span>
                        </button>
                      );
                    })}
                  </div>

                  <div className="flex items-center gap-2">
                    <span className="text-[11px] text-slate-500 font-mono hidden sm:inline">
                      Densidade: <strong className="text-slate-300">{metrics.density}</strong>
                    </span>

                    {/* Botões de Redimensionar Altura do Painel de Tabelas */}
                    <div className="flex items-center bg-dark-950 p-0.5 rounded-lg border border-slate-800">
                      <button
                        onClick={() => setTablePanelSize('compact')}
                        className={`px-2 py-0.5 text-[10px] rounded font-mono font-semibold transition ${
                          tablePanelSize === 'compact' ? 'bg-cyan-500 text-white' : 'text-slate-400 hover:text-white'
                        }`}
                        title="Altura Compacta"
                      >
                        P
                      </button>
                      <button
                        onClick={() => setTablePanelSize('medium')}
                        className={`px-2 py-0.5 text-[10px] rounded font-mono font-semibold transition ${
                          tablePanelSize === 'medium' ? 'bg-cyan-500 text-white' : 'text-slate-400 hover:text-white'
                        }`}
                        title="Altura Média"
                      >
                        M
                      </button>
                      <button
                        onClick={() => setTablePanelSize('large')}
                        className={`px-2 py-0.5 text-[10px] rounded font-mono font-semibold transition ${
                          tablePanelSize === 'large' ? 'bg-cyan-500 text-white' : 'text-slate-400 hover:text-white'
                        }`}
                        title="Altura Expandida"
                      >
                        G
                      </button>
                    </div>
                  </div>
                </div>

                {/* Conteúdo Dinâmico das Tabelas */}
                <div className={`${panelHeightClasses[tablePanelSize]} p-3 overflow-y-auto flex-1`}>
                  
                  {/* ========================================================= */}
                  {/* TABELA 1: MATRIZ DE ADJACÊNCIA INTERATIVA (PREENCHÍVEL) */}
                  {/* ========================================================= */}
                  {activeBottomTab === 'matrix' && (
                    <div className="space-y-3">
                      {/* Barra de Ações Rápidas da Matriz */}
                      <div className="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-slate-800/80">
                        <div className="flex items-center gap-1.5">
                          <button
                            onClick={handleAddVertexFromTable}
                            className="px-2.5 py-1 rounded-lg bg-teal-500/20 hover:bg-teal-500/30 border border-teal-500/40 text-teal-300 text-xs font-bold flex items-center gap-1 transition"
                            title="Adicionar novo vértice (cria nova linha e coluna na matriz)"
                          >
                            <Icons.Plus /> Adicionar Vértice
                          </button>

                          <button
                            onClick={handleComplementaryGraph}
                            className="px-2.5 py-1 rounded-lg bg-dark-850 hover:bg-dark-800 border border-slate-700 text-slate-300 text-xs font-semibold flex items-center gap-1 transition"
                            title="Inverter todas as conexões (Grafo Complementar)"
                          >
                            <Icons.Shuffle /> Grafo Complementar (Ḡ)
                          </button>

                          <button
                            onClick={handleCompleteGraph}
                            className="px-2.5 py-1 rounded-lg bg-dark-850 hover:bg-dark-800 border border-slate-700 text-slate-300 text-xs font-semibold flex items-center gap-1 transition"
                            title="Conectar todos os vértices (Grafo Completo Kn)"
                          >
                            Grafo Completo (Kn)
                          </button>

                          <button
                            onClick={handleClearMatrix}
                            className="px-2.5 py-1 rounded-lg bg-dark-850 hover:bg-rose-950/40 border border-slate-700 text-slate-400 hover:text-rose-300 text-xs font-semibold flex items-center gap-1 transition"
                            title="Remover todas as arestas"
                          >
                            Zerar Matriz
                          </button>
                        </div>

                        <span className="text-[11px] text-slate-400 flex items-center gap-1 font-mono">
                          💡 Clique em qualquer célula <strong className="text-cyan-400">0</strong> ou <strong className="text-teal-400">1</strong> para alternar conexões com motion!
                        </span>
                      </div>

                      )}

                      <div className="space-y-2">
                        {compareResult.resultados.map(r => {
                          const pct = Math.round((r.coresUsadas / compareResult.maxCores) * 100);
                          const otimo = r.coresUsadas === compareResult.otimo;
                          return (
                            <div key={r.id} className="bg-dark-950 border border-slate-800 rounded-xl p-3">
                              <div className="flex items-center justify-between mb-1.5">
                                <div className="flex items-center gap-2 min-w-0">
                                  <span className="text-xs font-bold text-slate-200 truncate">{r.nome}</span>
                                  <span className="text-[9px] px-1.5 py-0.5 rounded bg-dark-850 font-mono text-slate-400 border border-slate-700/60">
                                    {r.tag}
                                  </span>
                                </div>
                                <span className={`text-xs font-extrabold font-mono shrink-0 ${otimo ? 'text-emerald-400' : 'text-rose-400'}`}>
                                  {r.coresUsadas} cor{r.coresUsadas > 1 ? 'es' : ''}
                                  {otimo ? ' · ótimo' : ` · +${r.coresUsadas - compareResult.otimo}`}
                                </span>
                              </div>
                              <div className="h-2 rounded-full bg-dark-900 overflow-hidden mb-1.5">
                                <div
                                  className={`h-full rounded-full ${otimo ? 'bg-emerald-500' : 'bg-rose-500'}`}
                                  style={{ width: `${pct}%` }}
                                ></div>
                              </div>
                              <div className="flex flex-wrap items-center gap-x-3 gap-y-1 text-[10px] text-slate-500 font-mono">
                                <span>passos: {r.passos}</span>
                                <span>tempo: {r.tempoMs.toFixed(2)} ms</span>
                                <span>conflitos: {r.conflitos}</span>
                                <span>vértices coloridos: {r.verticesColoridos}/{metrics.n}</span>
                                <span className={r.valida ? 'text-emerald-500' : 'text-rose-500'}>
                                  {r.valida ? 'coloração válida' : 'coloração inválida'}
                                </span>
                              </div>
                            </div>
                          );
                        })}
                      </div>

                      <p className="text-[10px] text-slate-500 leading-relaxed">
                        Leitura: a barra mostra o número de cores em relação ao pior resultado da rodada. O número de passos da
                        coloração exata inclui as tentativas com k cores que falharam — é o preço da garantia de otimalidade.
                      </p>
                    </>
                  )}
                </div>

                <div className="p-4 border-t border-slate-800 bg-dark-950 flex items-center justify-between gap-2 flex-wrap">
                  <span className="text-[10px] text-slate-500 font-mono">
                    {compareResult ? `${compareResult.resultados.length} algoritmos · χ = ${compareResult.otimo}` : ''}
                  </span>
                  <button
                    onClick={() => setShowCompareModal(false)}
                    className="px-3 py-1.5 rounded-lg bg-teal-500 hover:bg-teal-400 text-white text-[11px] font-bold transition"
                  >
                    Fechar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: EXPLICAÇÃO EM MARKDOWN */}
          {showExplainModal && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-dark-900 border border-slate-700 w-full max-w-3xl max-h-[85vh] rounded-2xl flex flex-col shadow-2xl overflow-hidden">
                <div className="p-4 border-b border-slate-800 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-lg bg-teal-500/20 text-teal-400 flex items-center justify-center font-bold">
                      χ
                    </div>
                    <div>
                      <h3 className="font-extrabold text-base text-white">Explicação em Markdown</h3>
                      <p className="text-xs text-slate-400">Invariantes, classes de cor e a justificativa de cada passo</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowExplainModal(false)}
                    className="w-8 h-8 rounded-lg text-slate-400 hover:text-white transition"
                    title="Fechar"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-4 overflow-y-auto">
                  <pre className="text-[11px] font-mono text-slate-300 bg-dark-950 border border-slate-800 rounded-xl p-3 whitespace-pre-wrap break-words">{explainMarkdown}</pre>
                </div>

                <div className="p-4 border-t border-slate-800 bg-dark-950 flex items-center justify-between gap-2 flex-wrap">
                  <span className="text-[10px] text-slate-500 font-mono">
                    {explainMarkdown.split('\n').length} linhas · {explainMarkdown.length} caracteres
                  </span>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={handleDownloadExplain}
                      className="px-3 py-1.5 rounded-lg bg-dark-850 hover:bg-dark-800 border border-slate-700 text-slate-300 text-[11px] font-bold transition"
                    >
                      Baixar .md
                    </button>
                    <button
                      onClick={handleCopyExplain}
                      className={`px-3 py-1.5 rounded-lg text-[11px] font-bold transition ${
                        explainCopied
                          ? 'bg-emerald-600 text-white'
                          : 'bg-teal-500 hover:bg-teal-400 text-white'
                      }`}
                    >
                      {explainCopied ? 'Copiado!' : 'Copiar Markdown'}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: REDE LOCAL (LAN HOSTING) */}
          {showLanModal && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-dark-900 border border-slate-700 w-full max-w-md rounded-2xl p-5 shadow-2xl">
                <div className="flex items-center justify-between mb-4 pb-2 border-b border-slate-800">
                  <h3 className="font-extrabold text-base text-white flex items-center gap-2">
                    <Icons.Share2 /> Servidor na Rede Local (LAN)
                  </h3>
                  <button onClick={() => setShowLanModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <p className="text-xs text-slate-300 mb-3 leading-relaxed">
                  O simulador está disponível para qualquer dispositivo (celulares, tablets, notebooks do laboratório) conectado à mesma rede Wi-Fi ou Ethernet:
                </p>

                <div className="space-y-2 mb-4 font-mono text-xs">
                  <div className="p-2.5 rounded-xl bg-dark-950 border border-teal-500/30 flex items-center justify-between">
                    <div>
                      <span className="text-[10px] text-slate-500 block">Endereço IP na LAN:</span>
                      <strong className="text-teal-400 text-sm">http://10.36.134.7:8080/</strong>
                    </div>
                    <button
                      onClick={() => navigator.clipboard?.writeText('http://10.36.134.7:8080/')}
                      className="px-2.5 py-1 rounded-lg bg-teal-500/20 hover:bg-teal-500/30 text-teal-300 text-[10px] font-bold"
                    >
                      Copiar
                    </button>
                  </div>

                  <div className="p-2.5 rounded-xl bg-dark-950 border border-slate-800 flex items-center justify-between">
                    <div>
                      <span className="text-[10px] text-slate-500 block">Acesso Localhost:</span>
                      <strong className="text-slate-300">http://localhost:8080/</strong>
                    </div>
                    <button
                      onClick={() => navigator.clipboard?.writeText('http://localhost:8080/')}
                      className="px-2.5 py-1 rounded-lg bg-dark-850 hover:bg-dark-800 text-slate-400 text-[10px] font-bold"
                    >
                      Copiar
                    </button>
                  </div>
                </div>

                <div className="p-3 bg-dark-950 rounded-xl border border-slate-800 text-[11px] text-slate-400 mb-4">
                  💡 <strong>Dica de Uso:</strong> Compartilhe o link acima com colegas na mesma rede para demonstrações ao vivo ou estudos em grupo!
                </div>

                <div className="flex justify-end">
                  <button
                    onClick={() => setShowLanModal(false)}
                    className="px-5 py-2 rounded-xl bg-teal-500 hover:bg-teal-400 text-white font-bold text-xs"
                  >
                    Fechar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: GERADOR DE GRAFO ALEATÓRIO G(N, P) */}
          {showRandomModal && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-dark-900 border border-slate-700 w-full max-w-md rounded-2xl p-5 shadow-2xl">
                <div className="flex items-center justify-between mb-4 pb-2 border-b border-slate-800">
                  <h3 className="font-extrabold text-base text-white flex items-center gap-2">
                    <Icons.Shuffle /> Gerador Erdős-Rényi G(n, p)
                  </h3>
                  <button onClick={() => setShowRandomModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-4 text-xs mb-5">
                  <div>
                    <div className="flex justify-between mb-1">
                      <span className="text-slate-300 font-semibold">Número de Vértices (|V| = n):</span>
                      <span className="text-teal-400 font-bold font-mono">{randomN}</span>
                    </div>
                    <input
                      type="range"
                      min="4"
                      max="20"
                      value={randomN}
                      onChange={(e) => setRandomN(e.target.value)}
                      className="w-full accent-teal-500 h-1.5 bg-slate-800 rounded-lg cursor-pointer"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between mb-1">
                      <span className="text-slate-300 font-semibold">Probabilidade de Aresta (p):</span>
                      <span className="text-cyan-400 font-bold font-mono">{(randomP * 100).toFixed(0)}%</span>
                    </div>
                    <input
                      type="range"
                      min="0.10"
                      max="0.85"
                      step="0.05"
                      value={randomP}
                      onChange={(e) => setRandomP(e.target.value)}
                      className="w-full accent-cyan-500 h-1.5 bg-slate-800 rounded-lg cursor-pointer"
                    />
                  </div>
                </div>

                <div className="flex justify-end gap-2">
                  <button
                    onClick={() => setShowRandomModal(false)}
                    className="px-4 py-2 rounded-xl bg-dark-850 hover:bg-dark-800 text-slate-300 font-semibold text-xs"
                  >
                    Cancelar
                  </button>
                  <button
                    onClick={handleGenerateRandom}
                    className="px-5 py-2 rounded-xl bg-teal-500 hover:bg-teal-400 text-white font-bold text-xs transition shadow-lg shadow-teal-500/20"
                  >
                    Gerar Grafo
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ChromaticGraphSimulator />);
  </script>
</body>
</html>
